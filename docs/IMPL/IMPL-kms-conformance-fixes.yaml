title: KMS API Conformance Fixes (22 Critical + Minor Issues)
feature_slug: kms-conformance-fixes
verdict: SUITABLE
suitability_assessment: |-
    All five suitability gate checks pass cleanly.

    1. File decomposition: 8 distinct implementation files split cleanly by layer and domain:
       - Storage layer (4 files): storage.go, asymmetric.go, mac.go, importjob.go
       - Server layer (4 files): server.go, asymmetric.go, mac.go, raw.go
       Each layer is independently ownable; storage agents produce new function signatures
       consumed by server agents. This is a clean depth-0 / depth-1 DAG.

    2. No investigation-first items: All 22 critical issues are diagnosed with known root
       causes and precise fixes documented in the conformance report. No unknown crashes or
       races to reproduce first.

    3. Interface discoverability: Storage function signatures that change are fully
       determinable from the report:
       - storage.Encrypt(keyName, plaintext, aad) — adds aad parameter
       - storage.Decrypt(keyName, ciphertext, aad) — adds aad parameter
       - storage.CreateCryptoKeyVersion(keyName, reqVersion) — adds reqVersion parameter
       - storage.UpdateCryptoKey(keyName, key, mask) — replaces labels with full key + mask
       - storage.UpdateCryptoKeyVersion(versionName, state, mask) — adds mask validation
       - storage.DestroyCryptoKeyVersion(versionName) — makes idempotent, returns DestroyTime
       All other storage functions (AsymmetricDecrypt, MacSign, MacVerify) gain algorithm
       awareness internally without signature changes.

    4. Pre-implementation status: Checked against current codebase. Every critical fix is
       confirmed TODO (none already done). Minor ProtectionLevel/GenerateTime fields missing
       on all CryptoKeyVersion responses — also all TODO.

    5. Parallelization value: HIGH. Build+test cycle is ~8-15s for this module. 6 agents
       (3 storage, 3 server) with 2-5 files each. Wave 1 maximizes parallelism across all
       storage and most server files simultaneously (they edit disjoint files). Wave 2
       handles server.go which depends on new storage signatures.

    Estimated times:
    - Scout phase: ~15 min (dependency mapping, interface contracts, IMPL doc)
    - Agent execution: ~40 min (Wave 1: 5 agents x ~8 min avg, parallel; Wave 2: 1 agent x ~10 min)
    - Merge and verification: ~5 min
    Total SAW time: ~60 min

    Sequential baseline: ~90 min (6 agents x 15 min avg sequential time)
    Time savings: ~30 min (33% faster)

    Recommendation: Clear speedup with additional benefit of parallel review coverage across
    separate ownership domains. Proceed.
