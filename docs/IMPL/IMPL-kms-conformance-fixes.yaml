interface_contracts:
    - name: storage.Encrypt
      description: |-
        Encrypt now accepts AdditionalAuthenticatedData (aad) and returns
        both the ciphertext and the version name used, enabling server to
        populate EncryptResponse.Name with the version name.
      definition: |-
        func (s *Storage) Encrypt(keyName string, plaintext []byte, aad []byte) (ciphertext []byte, versionName string, err error)
        // Purpose validation: must be ENCRYPT_DECRYPT, else ErrFailedPrecondition
        // Returns versionName = primary version resource name (e.g. ".../cryptoKeyVersions/1")
        // aad is passed to gcm.Seal as the additionalData parameter
      location: internal/storage/storage.go
    - name: storage.Decrypt
      description: |-
        Decrypt now accepts AdditionalAuthenticatedData (aad) and returns
        which version was used (to allow server to set UsedPrimary correctly).
      definition: |-
        func (s *Storage) Decrypt(keyName string, ciphertext []byte, aad []byte) (plaintext []byte, usedVersionName string, err error)
        // Purpose validation: must be ENCRYPT_DECRYPT, else ErrFailedPrecondition
        // aad is passed to gcm.Open as the additionalData parameter
        // usedVersionName allows server to compare with PrimaryVersion
      location: internal/storage/storage.go
    - name: storage.CreateCryptoKeyVersion
      description: |-
        CreateCryptoKeyVersion now accepts the requested version proto so that
        state and algorithm overrides from the request are honoured.
      definition: |-
        func (s *Storage) CreateCryptoKeyVersion(keyName string, req *kmspb.CryptoKeyVersion) (*kmspb.CryptoKeyVersion, error)
        // req may be nil (backwards-compatible: falls back to key's VersionTemplate)
        // If req.Algorithm is non-UNSPECIFIED, override the template algorithm
        // Returns version proto with ProtectionLevel=SOFTWARE, GenerateTime=CreateTime
      location: internal/storage/storage.go
    - name: storage.UpdateCryptoKey
      description: |-
        UpdateCryptoKey now accepts the full CryptoKey and a FieldMask, applying
        only the fields listed in the mask.
      definition: |-
        func (s *Storage) UpdateCryptoKey(keyName string, key *kmspb.CryptoKey, mask *fieldmaskpb.FieldMask) (*kmspb.CryptoKey, error)
        // Supported mask paths: "labels", "rotation_period", "next_rotation_time",
        //   "version_template", "destroy_scheduled_duration"
        // Unrecognised paths are silently ignored (match real API behaviour)
      location: internal/storage/storage.go
    - name: storage.UpdateCryptoKeyVersion
      description: |-
        UpdateCryptoKeyVersion now validates the update_mask and enforces state
        transition rules: only ENABLED<->DISABLED transitions permitted.
      definition: |-
        func (s *Storage) UpdateCryptoKeyVersion(versionName string, state kmspb.CryptoKeyVersion_CryptoKeyVersionState, mask *fieldmaskpb.FieldMask) (*kmspb.CryptoKeyVersion, error)
        // Validates mask contains "state" before applying
        // Enforces: source must be ENABLED or DISABLED
        //           target must be ENABLED or DISABLED
        //           no other state transitions permitted via this method
      location: internal/storage/storage.go
    - name: storage.DestroyCryptoKeyVersion
      description: |-
        DestroyCryptoKeyVersion is now idempotent for DESTROY_SCHEDULED versions
        and sets DestroyTime on the returned proto.
      definition: |-
        func (s *Storage) DestroyCryptoKeyVersion(versionName string) (*kmspb.CryptoKeyVersion, error)
        // If state == DESTROY_SCHEDULED: return version as-is (idempotent, no error)
        // If state == DESTROYED: return ErrFailedPrecondition (unchanged)
        // On transition: set DestroyTime = now + 30 days; persist on StoredCryptoKeyVersion
        // StoredCryptoKeyVersion gains DestroyTime time.Time field
      location: internal/storage/storage.go
    - name: storage.AsymmetricDecrypt
      description: AsymmetricDecrypt now selects the OAEP hash based on the version algorithm.
      definition: |-
        func (s *Storage) AsymmetricDecrypt(versionName string, ciphertext []byte) ([]byte, error)
        // Signature unchanged; internal change: select hash from algorithm
        // RSA_DECRYPT_OAEP_*_SHA1   -> sha1.New()
        // RSA_DECRYPT_OAEP_*_SHA256 -> sha256.New()
        // RSA_DECRYPT_OAEP_*_SHA512 -> sha512.New()
      location: internal/storage/asymmetric.go
    - name: storage.AsymmetricSign
      description: |-
        AsymmetricSign now accepts optional rawData for direct signing
        (hashing internally) in addition to pre-hashed digest.
      definition: |-
        func (s *Storage) AsymmetricSign(versionName string, digest []byte, digestType string, rawData []byte) ([]byte, error)
        // rawData: if non-nil, hash with algorithm's hash then sign (data field support)
        // digest/digestType: used when rawData is nil (existing behaviour)
        // Purpose validation: parent key must be ASYMMETRIC_SIGN
      location: internal/storage/asymmetric.go
    - name: storage.MacSign
      description: MacSign now selects the HMAC hash based on the key version algorithm.
      definition: |-
        func (s *Storage) MacSign(versionName string, data []byte) ([]byte, error)
        // Signature unchanged; internal change: select hash from version.Algorithm
        // HMAC_SHA1   -> sha1.New
        // HMAC_SHA224 -> sha256.New (sha224 via sha256.New224)
        // HMAC_SHA256 -> sha256.New  (existing)
        // HMAC_SHA384 -> sha512.New384
        // HMAC_SHA512 -> sha512.New
        // Purpose validation: parent key must be MAC
      location: internal/storage/mac.go
    - name: storage.MacVerify
      description: MacVerify now selects the HMAC hash based on the key version algorithm.
      definition: |-
        func (s *Storage) MacVerify(versionName string, data []byte, mac []byte) (bool, error)
        // Signature unchanged; internal change: same hash selection as MacSign
        // Purpose validation: parent key must be MAC
      location: internal/storage/mac.go
    - name: storage.findKeyAndVersion
      description: |-
        New helper that returns both the parent StoredCryptoKey and the
        StoredCryptoKeyVersion for a version resource name. Required by all
        purpose-validation paths (asymmetric, mac, raw ops).
      definition: |-
        func (s *Storage) findKeyAndVersion(versionName string) (*StoredCryptoKey, *StoredCryptoKeyVersion)
        // Caller must hold at least s.mu.RLock
        // Returns (nil, nil) if not found
      location: internal/storage/asymmetric.go
    - name: verifyCRC32C (server-layer helper)
      description: |-
        New server-layer helper for CRC32C input verification. Returns
        codes.DataLoss (for Encrypt/Decrypt/Raw) or codes.InvalidArgument
        per-method. Using DataLoss matches the real API for encrypted data
        integrity checks; server methods use appropriate code per-context.
      definition: |-
        func verifyCRC32C(data []byte, provided *wrapperspb.Int64Value) error
        // If provided is nil: return nil (no verification requested)
        // Compute crc32c(data); compare to provided.Value
        // On mismatch: return status.Error(codes.InvalidArgument, "request corrupted in transit")
        // Located in internal/server/crc32c.go (extend existing file)
      location: internal/server/crc32c.go
waves:
    - number: 1
      agents:
        - id: A
          task: |-
            ## Role
            Storage layer: symmetric encrypt/decrypt, key CRUD, and key generation fixes.

            ## What to implement

            ### 1. StoredCryptoKeyVersion: add DestroyTime field
            In `internal/storage/storage.go`, add `DestroyTime time.Time` to the
            `StoredCryptoKeyVersion` struct.

            ### 2. storage.Encrypt — new signature
            Change the signature to:
            ```go
            func (s *Storage) Encrypt(keyName string, plaintext []byte, aad []byte) (ciphertext []byte, versionName string, err error)
            ```
            - Validate `cryptoKey.Purpose == kmspb.CryptoKey_ENCRYPT_DECRYPT`; if not,
              return `&ErrFailedPrecondition{Message: "key purpose must be ENCRYPT_DECRYPT"}`.
            - Pass `aad` to `gcm.Seal(nonce, nonce, plaintext, aad)`.
            - Return `cryptoKey.PrimaryVersion` as the second return value.

            ### 3. storage.Decrypt — new signature
            Change the signature to:
            ```go
            func (s *Storage) Decrypt(keyName string, ciphertext []byte, aad []byte) (plaintext []byte, usedVersionName string, err error)
            ```
            - Validate `cryptoKey.Purpose == kmspb.CryptoKey_ENCRYPT_DECRYPT`.
            - Pass `aad` to `gcm.Open(nil, nonce, ciphertext, aad)` inside `decryptWithVersion`.
              Update the private helper: `func (s *Storage) decryptWithVersion(version *StoredCryptoKeyVersion, ciphertext []byte, aad []byte) ([]byte, error)`.
            - Track which version succeeded; return its Name as `usedVersionName`.

            ### 4. storage.UpdateCryptoKey — new signature
            Change the signature to:
            ```go
            func (s *Storage) UpdateCryptoKey(keyName string, key *kmspb.CryptoKey, mask *fieldmaskpb.FieldMask) (*kmspb.CryptoKey, error)
            ```
            Import `google.golang.org/protobuf/types/known/fieldmaskpb`.
            Implement field-by-field update logic:
            - `"labels"` → replace `cryptoKey.Labels` with `key.Labels`
            - `"rotation_period"` → set `cryptoKey.RotationPeriod` (add field to StoredCryptoKey if needed)
            - `"next_rotation_time"` → set `cryptoKey.NextRotationTime`
            - `"version_template"` → replace `cryptoKey.VersionTemplate`
            - `"destroy_scheduled_duration"` → set `cryptoKey.DestroyScheduledDuration`
            Add the corresponding fields to `StoredCryptoKey` if they do not exist:
            `RotationPeriod *durationpb.Duration`, `NextRotationTime *timestamppb.Timestamp`,
            `DestroyScheduledDuration *durationpb.Duration`.
            Import `google.golang.org/protobuf/types/known/durationpb`.
            Populate all added fields in the `*kmspb.CryptoKey` return value.

            ### 5. storage.UpdateCryptoKeyVersion — validate mask + state transitions
            Change the signature to:
            ```go
            func (s *Storage) UpdateCryptoKeyVersion(versionName string, state kmspb.CryptoKeyVersion_CryptoKeyVersionState, mask *fieldmaskpb.FieldMask) (*kmspb.CryptoKeyVersion, error)
            ```
            - If mask is non-nil and `"state"` is not in `mask.Paths`, return
              `ErrFailedPrecondition{"update_mask must contain state"}`.
            - Validate current state: source must be ENABLED or DISABLED.
            - Validate target state: must be ENABLED or DISABLED.
            - If either check fails, return `ErrFailedPrecondition` with a descriptive message.

            ### 6. storage.DestroyCryptoKeyVersion — idempotent + DestroyTime
            - If `version.State == kmspb.CryptoKeyVersion_DESTROY_SCHEDULED`:
              return the version as-is (no error, idempotent). Populate `DestroyTime`
              from the stored field.
            - On a new destruction:
              `version.DestroyTime = time.Now().Add(30 * 24 * time.Hour)`
              `version.State = kmspb.CryptoKeyVersion_DESTROY_SCHEDULED`
            - Include `DestroyTime: timestamppb.New(version.DestroyTime)` in all
              CryptoKeyVersion proto returns from this function.

            ### 7. storage.CreateCryptoKeyVersion — accept req parameter
            Change the signature to:
            ```go
            func (s *Storage) CreateCryptoKeyVersion(keyName string, req *kmspb.CryptoKeyVersion) (*kmspb.CryptoKeyVersion, error)
            ```
            - If `req != nil && req.Algorithm != UNSPECIFIED`, override the template algorithm.
            - Populate `ProtectionLevel: kmspb.ProtectionLevel_SOFTWARE` and
              `GenerateTime: timestamppb.New(now)` on the returned CryptoKeyVersion proto.

            ### 8. storage.CreateCryptoKey — reject UNSPECIFIED purpose + defaults
            - Return `&ErrFailedPrecondition{Message: "crypto_key.purpose is required"}` when
              purpose is `CRYPTO_KEY_PURPOSE_UNSPECIFIED`. (Server will map to InvalidArgument.)
            - Set `DestroyScheduledDuration` to 30 days on `StoredCryptoKey`.
            - Populate `ProtectionLevel=SOFTWARE`, `GenerateTime` on the Primary version proto.

            ### 9. storage.ListKeyRings — filter by parent prefix
            In `ListKeyRings(parent string)`, only include keyrings whose name has prefix
            `parent + "/keyRings/"`.

            ### 10. keymaterial.go — add missing HMAC algorithm key sizes
            In `generateKeyMaterial`, add cases for:
            - `HMAC_SHA1`: generate 20-byte key
            - `HMAC_SHA224`: generate 28-byte key
            - `HMAC_SHA384`: generate 48-byte key
            - `HMAC_SHA512`: generate 64-byte key

            Also add `AES_128_GCM` case (16-byte symmetric key).

            ### 11. All CryptoKeyVersion proto responses — populate ProtectionLevel + GenerateTime
            In `storage.go`, in every place a `*kmspb.CryptoKeyVersion` proto is constructed
            (GetCryptoKeyVersion, ListCryptoKeyVersions, UpdateCryptoKeyVersion,
            UpdateCryptoKeyPrimaryVersion, RestoreCryptoKeyVersion), add:
            ```go
            ProtectionLevel: kmspb.ProtectionLevel_SOFTWARE,
            GenerateTime:    timestamppb.New(version.CreateTime),
            ```

            ## Tests
            Create `internal/storage/storage_conformance_test.go` (package `storage`) with
            tests for:
            - `TestEncrypt_AAD`: encrypt with aad, verify decrypt with same aad succeeds;
              decrypt with different aad fails.
            - `TestEncrypt_PurposeCheck`: create MAC-purpose key, call Encrypt, expect
              ErrFailedPrecondition.
            - `TestEncrypt_ReturnsVersionName`: check second return value is a version name
              containing "cryptoKeyVersions/".
            - `TestDecrypt_PurposeCheck`: same for Decrypt.
            - `TestUpdateCryptoKey_Mask`: update only "labels", verify other fields unchanged.
            - `TestUpdateCryptoKeyVersion_StateTransition`: ENABLED→DISABLED ok;
              ENABLED→DESTROY_SCHEDULED fails; DESTROY_SCHEDULED→ENABLED fails.
            - `TestDestroyCryptoKeyVersion_Idempotent`: destroy twice, expect no error on second.
            - `TestDestroyCryptoKeyVersion_DestroyTime`: verify DestroyTime is non-zero on response.
            - `TestCreateCryptoKey_UnspecifiedPurpose`: expect error.
            - `TestCreateCryptoKeyVersion_AlgorithmOverride`: pass req with HMAC_SHA384, verify version.Algorithm.

            ## Verification gate
            ```
            go build ./internal/storage/...
            go vet ./internal/storage/...
            go test ./internal/storage/...
            ```

            ## Constraints
            - Do not modify any server-layer files.
            - Do not modify asymmetric.go, mac.go, or importjob.go in the storage package.
            - The `decryptWithVersion` helper is private to storage.go; update its signature
              to accept aad and update all call sites within the file.
            - Import `fieldmaskpb` only in storage.go, not in other storage files.
            - `StoredCryptoKey` struct fields added: `RotationPeriod`, `NextRotationTime`,
              `DestroyScheduledDuration`, `DestroyScheduledDurationDefault` (set to 30*24h on create).
            - You MUST also update internal/storage/storage_test.go to fix existing call sites
              that break due to signature changes:
              - `s.Encrypt(...)` changes from `([]byte, error)` to `([]byte, string, error)` —
                update all 2-value assignments (lines ~234, 343, 361, 408) to 3-value
              - `s.Decrypt(...)` changes from `([]byte, error)` to `([]byte, string, error)` —
                update all 2-value assignments (lines ~243, 366, 375, 413) to 3-value
              - `s.CreateCryptoKeyVersion(keyName)` adds a second `req *kmspb.CryptoKeyVersion`
                parameter — update all 1-argument calls (lines ~272, 305, 348) to pass `nil`
                as the second argument.
          files:
            - internal/storage/storage.go
            - internal/storage/keymaterial.go
            - internal/storage/storage_test.go
            - internal/storage/storage_conformance_test.go
        - id: B
          task: |-
            ## Role
            Storage layer: asymmetric sign and decrypt fixes.

            ## What to implement

            ### 1. storage.findKeyAndVersion — new helper
            Add to `internal/storage/asymmetric.go`:
            ```go
            func (s *Storage) findKeyAndVersion(versionName string) (*StoredCryptoKey, *StoredCryptoKeyVersion)
            ```
            Iterate `s.keyrings` and their `CryptoKeys`; return the parent `StoredCryptoKey`
            and the `StoredCryptoKeyVersion` together when the version name matches.
            Returns `(nil, nil)` if not found. Caller holds at least `s.mu.RLock`.

            Replace all calls to `s.findVersion(versionName)` in asymmetric.go with
            `s.findKeyAndVersion(versionName)` and use the returned key for purpose checks.

            ### 2. AsymmetricSign — purpose validation + data field support
            Change the signature to:
            ```go
            func (s *Storage) AsymmetricSign(versionName string, digest []byte, digestType string, rawData []byte) ([]byte, error)
            ```
            - Add purpose check: `cryptoKey.Purpose != kmspb.CryptoKey_ASYMMETRIC_SIGN` →
              `ErrFailedPrecondition{"key purpose must be ASYMMETRIC_SIGN"}`.
            - If `rawData != nil`:
              - Derive the hash function from the version algorithm:
                - EC_SIGN_P256_SHA256, RSA_SIGN_PKCS1_2048_SHA256, RSA_SIGN_PKCS1_3072_SHA256,
                  RSA_SIGN_PKCS1_4096_SHA256 → SHA-256
                - EC_SIGN_P384_SHA384 → SHA-384
                - RSA_SIGN_PKCS1_4096_SHA512 → SHA-512
              - Hash `rawData` internally; use the result as `digest`.
              - Set `digestType` accordingly.
            - Existing digest-based path is unchanged when `rawData` is nil.

            ### 3. AsymmetricDecrypt — purpose validation + OAEP hash selection
            - Add purpose check using `findKeyAndVersion`: `cryptoKey.Purpose != kmspb.CryptoKey_ASYMMETRIC_DECRYPT` →
              `ErrFailedPrecondition{"key purpose must be ASYMMETRIC_DECRYPT"}`.
            - Replace hardcoded `sha256.New()` with a helper `oaepHashFromAlgorithm`:
              ```go
              func oaepHashFromAlgorithm(alg kmspb.CryptoKeyVersion_CryptoKeyVersionAlgorithm) hash.Hash
              ```
              - `*_SHA1`   → `sha1.New()`
              - `*_SHA256` → `sha256.New()`
              - `*_SHA512` → `sha512.New()`
            - Pass the result to `rsa.DecryptOAEP(oaepHashFromAlgorithm(version.Algorithm), ...)`.

            ### 4. GetPublicKey — purpose validation + allow DISABLED
            - Add purpose check: `cryptoKey.Purpose != kmspb.CryptoKey_ASYMMETRIC_SIGN &&
              cryptoKey.Purpose != kmspb.CryptoKey_ASYMMETRIC_DECRYPT` →
              `ErrFailedPrecondition{"key purpose must be ASYMMETRIC_SIGN or ASYMMETRIC_DECRYPT"}`.
            - Remove the ENABLED state check (allow DISABLED versions to return their public key).
              Keep the check that version exists and has AsymmetricKey material.

            ## Tests
            Create `internal/storage/asymmetric_conformance_test.go` (package `storage`) with:
            - `TestAsymmetricSign_PurposeCheck`: create ENCRYPT_DECRYPT key with RSA algorithm,
              call AsymmetricSign, expect ErrFailedPrecondition.
            - `TestAsymmetricSign_DataField`: create ASYMMETRIC_SIGN key, call AsymmetricSign
              with rawData set and digest/digestType empty, verify signature is valid.
            - `TestAsymmetricDecrypt_PurposeCheck`: create ASYMMETRIC_SIGN key, call
              AsymmetricDecrypt, expect ErrFailedPrecondition.
            - `TestAsymmetricDecrypt_SHA1Hash`: create RSA_DECRYPT_OAEP_2048_SHA1 key, encrypt
              with sha1 OAEP using the public key, then decrypt via storage — expect success.
            - `TestAsymmetricDecrypt_SHA512Hash`: same for RSA_DECRYPT_OAEP_4096_SHA512.
            - `TestGetPublicKey_AllowDisabled`: create key, disable the version via direct
              state manipulation, call GetPublicKey, expect success.
            - `TestGetPublicKey_PurposeCheck`: create ENCRYPT_DECRYPT key without asymmetric
              material, call GetPublicKey, expect ErrFailedPrecondition.

            ## Verification gate
            ```
            go build ./internal/storage/...
            go vet ./internal/storage/...
            go test ./internal/storage/...
            ```

            ## Constraints
            - Do not modify storage.go, mac.go, importjob.go, or keymaterial.go.
            - Add imports for `crypto/sha1`, `crypto/sha512`, `hash` as needed.
            - The `findVersion` helper in asymmetric.go is still used by mac.go and raw.go
              (they don't import asymmetric.go, they are in the same package). Keep
              `findVersion` as-is; `findKeyAndVersion` is a new addition that calls the
              same iteration pattern.
            - Do not change AsymmetricSign caller in mac.go or raw.go — those are handled
              by Agent C and remain on the same package, but this agent only edits asymmetric.go.
          files:
            - internal/storage/asymmetric.go
            - internal/storage/asymmetric_conformance_test.go
        - id: C
          task: |-
            ## Role
            Storage layer: MAC algorithm dispatch + ImportCryptoKeyVersion validation.

            ## What to implement

            ### 1. mac.go — purpose validation + algorithm-based hash selection

            In `internal/storage/mac.go`, both `MacSign` and `MacVerify` need two changes:

            **a. Purpose validation**
            Replace `s.findVersion(versionName)` with `s.findKeyAndVersion(versionName)`:
            ```go
            cryptoKey, version := s.findKeyAndVersion(versionName)
            if cryptoKey == nil {
                return ..., &ErrNotFound{Resource: versionName}
            }
            if cryptoKey.Purpose != kmspb.CryptoKey_MAC {
                return ..., &ErrFailedPrecondition{Message: "key purpose must be MAC"}
            }
            ```
            Note: `findKeyAndVersion` is defined in asymmetric.go in the same `storage`
            package — it is accessible here without import.

            **b. Algorithm-based hash selection**
            Replace the hardcoded `hmac.New(sha256.New, version.HMACKey)` with a call to
            a new helper `hmacHashFuncFromAlgorithm`:
            ```go
            func hmacHashFuncFromAlgorithm(alg kmspb.CryptoKeyVersion_CryptoKeyVersionAlgorithm) func() hash.Hash
            ```
            Mapping:
            - `HMAC_SHA1`   → `sha1.New`
            - `HMAC_SHA224` → `sha256.New224`
            - `HMAC_SHA256` → `sha256.New`  (existing behaviour)
            - `HMAC_SHA384` → `sha512.New384`
            - `HMAC_SHA512` → `sha512.New`
            - default → `sha256.New` (safe fallback, should not be reached)

            Apply this in both `MacSign` and `MacVerify`:
            ```go
            h := hmac.New(hmacHashFuncFromAlgorithm(version.Algorithm), version.HMACKey)
            ```

            ### 2. importjob.go — validate algorithm not UNSPECIFIED
            In `ImportCryptoKeyVersion`, add after the import job active check:
            ```go
            if kmspb.CryptoKeyVersion_CryptoKeyVersionAlgorithm(algorithm) ==
                kmspb.CryptoKeyVersion_CRYPTO_KEY_VERSION_ALGORITHM_UNSPECIFIED {
                return nil, &ErrFailedPrecondition{Message: "algorithm is required"}
