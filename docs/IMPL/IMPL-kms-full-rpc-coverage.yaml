interface_contracts:
    - name: StoredCryptoKeyVersion new fields
      description: |
        Add AsymmetricKey and HMACKey fields to StoredCryptoKeyVersion in storage.go.
        Populated during key creation based on algorithm.
      definition: |
        AsymmetricKey *AsymmetricKeyMaterial
        HMACKey       []byte
      location: internal/storage/storage.go
    - name: StoredKeyRing.ImportJobs field
      description: Add ImportJobs map to StoredKeyRing for import job storage.
      definition: |
        ImportJobs map[string]*StoredImportJob
      location: internal/storage/storage.go
    - name: Storage.AsymmetricSign
      description: Sign digest using asymmetric key version private key.
      definition: |
        func (s *Storage) AsymmetricSign(versionName string, digest []byte, digestType string) ([]byte, error)
      location: internal/storage/asymmetric.go
    - name: Storage.AsymmetricDecrypt
      description: Decrypt ciphertext using asymmetric RSA key version.
      definition: |
        func (s *Storage) AsymmetricDecrypt(versionName string, ciphertext []byte) ([]byte, error)
      location: internal/storage/asymmetric.go
    - name: Storage.GetPublicKey
      description: Return PEM-encoded public key for asymmetric key version.
      definition: |
        func (s *Storage) GetPublicKey(versionName string) (string, int32, error)
      location: internal/storage/asymmetric.go
    - name: Storage.MacSign
      description: Create HMAC tag for data using MAC key version.
      definition: |
        func (s *Storage) MacSign(versionName string, data []byte) ([]byte, error)
      location: internal/storage/mac.go
    - name: Storage.MacVerify
      description: Verify HMAC tag against data using MAC key version.
      definition: |
        func (s *Storage) MacVerify(versionName string, data []byte, mac []byte) (bool, error)
      location: internal/storage/mac.go
    - name: Storage.RawEncrypt
      description: AES-GCM encrypt without envelope wrapping.
      definition: |
        func (s *Storage) RawEncrypt(versionName string, plaintext []byte, aad []byte) (ciphertext []byte, iv []byte, tagLen int32, err error)
      location: internal/storage/raw.go
    - name: Storage.RawDecrypt
      description: AES-GCM decrypt without envelope wrapping.
      definition: |
        func (s *Storage) RawDecrypt(versionName string, ciphertext []byte, iv []byte, aad []byte) ([]byte, error)
      location: internal/storage/raw.go
    - name: Storage.CreateImportJob
      description: Create import job with RSA wrapping key.
      definition: |
        func (s *Storage) CreateImportJob(keyringName, importJobID string, importMethod int32, protectionLevel int32) (*StoredImportJob, error)
      location: internal/storage/importjob.go
    - name: Storage.GetImportJob
      description: Retrieve import job by name.
      definition: |
        func (s *Storage) GetImportJob(name string) (*StoredImportJob, error)
      location: internal/storage/importjob.go
    - name: Storage.ListImportJobs
      description: List import jobs in a keyring.
      definition: |
        func (s *Storage) ListImportJobs(keyringName string) ([]*StoredImportJob, error)
      location: internal/storage/importjob.go
    - name: Storage.ImportCryptoKeyVersion
      description: Import wrapped key material into a crypto key version.
      definition: |
        func (s *Storage) ImportCryptoKeyVersion(keyName string, algorithm int32, importJobName string, wrappedKey []byte) (*StoredCryptoKeyVersion, error)
      location: internal/storage/importjob.go
    - name: Storage.GenerateRandomBytes
      description: Generate cryptographically random bytes.
      definition: |
        func (s *Storage) GenerateRandomBytes(length int32) ([]byte, error)
      location: internal/storage/random.go
    - name: Storage.RestoreCryptoKeyVersion
      description: Restore DESTROY_SCHEDULED version to DISABLED.
      definition: |
        func (s *Storage) RestoreCryptoKeyVersion(versionName string) (*kmspb.CryptoKeyVersion, error)
      location: internal/storage/storage.go
    - name: generateKeyMaterial
      description: |
        Generate key material based on algorithm. Returns symmetric key, asymmetric
        key material, and HMAC key (only one non-nil based on algorithm).
        Lives in scaffold file internal/storage/keymaterial.go.
      definition: |
        func generateKeyMaterial(algorithm kmspb.CryptoKeyVersion_CryptoKeyVersionAlgorithm) (symmetricKey []byte, asymKey *AsymmetricKeyMaterial, hmacKey []byte, err error)
      location: internal/storage/keymaterial.go
waves:
    - number: 1
      agents:
        - id: A
          task: |
            ## Agent A -- Asymmetric Crypto Operations

            Implement AsymmetricSign, AsymmetricDecrypt, and GetPublicKey.

            ### Files to create

            **1. `internal/storage/asymmetric.go`** (package storage)

            Three methods on `*Storage`:

            `AsymmetricSign(versionName string, digest []byte, digestType string) ([]byte, error)`
            - s.mu.RLock(), find version iterating s.keyrings -> cryptoKeys -> versions
            - Validate: exists, State==ENABLED, AsymmetricKey!=nil
            - Parse key: key, _ := x509.ParsePKCS8PrivateKey(version.AsymmetricKey.PrivateKeyDER)
            - RSA: rsa.SignPKCS1v15(rand.Reader, rsaKey, hashType, digest)
            - EC: ecdsa.SignASN1(rand.Reader, ecKey, digest)
            - Map digestType: "SHA256"->crypto.SHA256, "SHA384"->crypto.SHA384, "SHA512"->crypto.SHA512
            - Return ErrFailedPrecondition for wrong key type or nil AsymmetricKey

            `AsymmetricDecrypt(versionName string, ciphertext []byte) ([]byte, error)`
            - RLock, find version, validate ENABLED + AsymmetricKey + is RSA
            - rsa.DecryptOAEP(sha256.New(), rand.Reader, privateKey, ciphertext, nil)

            `GetPublicKey(versionName string) (string, int32, error)`
            - RLock, find version, validate ENABLED + AsymmetricKey
            - Return version.AsymmetricKey.PublicKeyPEM, int32(version.Algorithm), nil

            Imports: crypto/ecdsa, crypto/rsa, crypto/sha256, crypto/sha512, crypto/rand,
            crypto/x509, crypto, fmt, kmspb

            **2. `internal/server/asymmetric.go`** (package server)

            Three methods on `*Server` that REPLACE stubs in server.go (removed Wave 2):

            `AsymmetricSign(ctx context.Context, req *kmspb.AsymmetricSignRequest) (*kmspb.AsymmetricSignResponse, error)`
            - requireField(req.Name, "name"), validate req.Digest != nil
            - checkPermission(ctx, "AsymmetricSign", authz.NormalizeCryptoKeyVersionResource(req.Name))
            - Extract digest bytes+type from req.Digest oneof (Sha256/Sha384/Sha512)
            - sig, err := s.storage.AsymmetricSign(req.Name, digestBytes, digestType)
            - Return &kmspb.AsymmetricSignResponse{Signature: sig}

            `AsymmetricDecrypt(ctx, req) (*kmspb.AsymmetricDecryptResponse, error)`
            - requireField, validate Ciphertext, checkPermission("AsymmetricDecrypt")
            - pt, err := s.storage.AsymmetricDecrypt(req.Name, req.Ciphertext)
            - Return &kmspb.AsymmetricDecryptResponse{Plaintext: pt}

            `GetPublicKey(ctx, req) (*kmspb.PublicKey, error)`
            - requireField, checkPermission("GetPublicKey")
            - pemStr, alg, err := s.storage.GetPublicKey(req.Name)
            - Return &kmspb.PublicKey{Pem: pemStr, Algorithm: CryptoKeyVersionAlgorithm(alg)}

            Imports: same as server.go (kmspb, codes, status, authz, storage)

            **3. `asymmetric_test.go`** (package gcp_kms_emulator_test)

            Uses setupTestServer/setupTestClient from integration_test.go.

            TestIntegration_AsymmetricSignVerify: Create keyring + ASYMMETRIC_SIGN key with
            EC_SIGN_P256_SHA256. Hash data with sha256.Sum256. AsymmetricSign. GetPublicKey,
            parse PEM with x509.ParsePKIXPublicKey, verify with ecdsa.VerifyASN1.

            TestIntegration_AsymmetricDecrypt: Create ASYMMETRIC_DECRYPT key with
            RSA_DECRYPT_OAEP_2048_SHA256. GetPublicKey, parse RSA pub, encrypt with
            rsa.EncryptOAEP. AsymmetricDecrypt, verify roundtrip.

            TestIntegration_GetPublicKey: Verify PEM non-empty and parseable.

            NOTE: Tests pass only after Wave 2 merge (stubs removed).

            ### Verification gate
            go build ./internal/storage/...

            ### Constraints
            - x509.ParsePKCS8PrivateKey for DER keys
            - EC: P-256 (SHA-256), P-384 (SHA-384)
            - RSA: 2048, 3072, 4096 bit
            - All storage methods use RLock
          files:
            - internal/storage/asymmetric.go
            - internal/server/asymmetric.go
            - asymmetric_test.go
          context_source: prepared-brief
        - id: B
          task: |
            ## Agent B -- MAC Operations

            Implement MacSign and MacVerify.

            ### Files to create

            **1. `internal/storage/mac.go`** (package storage)

            `MacSign(versionName string, data []byte) ([]byte, error)`
            - s.mu.RLock(), find version iterating keyrings/cryptoKeys/versions
            - Validate: exists, ENABLED, version.HMACKey != nil
            - h := hmac.New(sha256.New, version.HMACKey); h.Write(data); return h.Sum(nil), nil

            `MacVerify(versionName string, data []byte, mac []byte) (bool, error)`
            - Same find+validate, compute expected, return hmac.Equal(expected, mac), nil

            Imports: crypto/hmac, crypto/sha256, kmspb

            **2. `internal/server/mac.go`** (package server)

            `MacSign(ctx, req) (*kmspb.MacSignResponse, error)`
            - requireField, validate Data, checkPermission("MacSign"), s.storage.MacSign
            - Return &kmspb.MacSignResponse{Name: req.Name, Mac: mac}

            `MacVerify(ctx, req) (*kmspb.MacVerifyResponse, error)`
            - requireField, validate Data+Mac, checkPermission("MacVerify"), s.storage.MacVerify
            - Return &kmspb.MacVerifyResponse{Name: req.Name, Success: success}

            **3. `mac_test.go`** (package gcp_kms_emulator_test)

            TestIntegration_MacSignVerify: Create MAC key with HMAC_SHA256. MacSign, verify
            non-empty. MacVerify same -> true. MacVerify wrong data -> false.

            TestIntegration_MacSignWrongPurpose: ENCRYPT_DECRYPT key -> FailedPrecondition.

            ### Verification gate
            go build ./internal/storage/...

            ### Constraints
            - crypto/hmac + crypto/sha256 only
            - hmac.Equal for constant-time comparison
          files:
            - internal/storage/mac.go
            - internal/server/mac.go
            - mac_test.go
          context_source: prepared-brief
        - id: C
          task: |
            ## Agent C -- Raw Encrypt/Decrypt + GenerateRandomBytes

            Implement RawEncrypt, RawDecrypt, GenerateRandomBytes.

            ### Files to create

            **1. `internal/storage/raw.go`** (package storage)

            `RawEncrypt(versionName string, plaintext []byte, aad []byte) ([]byte, []byte, int32, error)`
            - RLock, find version, validate ENABLED + SymmetricKey non-nil
            - AES-GCM: aes.NewCipher, cipher.NewGCM, random nonce, gcm.Seal
            - Return sealed, nonce, int32(gcm.Overhead()), nil

            `RawDecrypt(versionName string, ciphertext []byte, iv []byte, aad []byte) ([]byte, error)`
            - RLock, find version, validate, AES-GCM, gcm.Open(nil, iv, ciphertext, aad)

            **2. `internal/storage/random.go`** (package storage)

            `GenerateRandomBytes(length int32) ([]byte, error)`
            - Validate 0 < length <= 1024
            - buf := make([]byte, length); io.ReadFull(rand.Reader, buf)

            **3. `internal/server/raw.go`** (package server)

            `RawEncrypt(ctx, req) (*kmspb.RawEncryptResponse, error)`
            - requireField, validate Plaintext, checkPermission("RawEncrypt")
            - ct, iv, tagLen, _ := s.storage.RawEncrypt(...)
            - Return &kmspb.RawEncryptResponse{Ciphertext, InitializationVector, TagLength}

            `RawDecrypt(ctx, req) (*kmspb.RawDecryptResponse, error)`
            - requireField, validate Ciphertext+IV, checkPermission("RawDecrypt")
            - Return &kmspb.RawDecryptResponse{Plaintext: pt}

            `GenerateRandomBytes(ctx, req) (*kmspb.GenerateRandomBytesResponse, error)`
            - requireField(req.Location, "location"), checkPermission("GenerateRandomBytes")
            - Return &kmspb.GenerateRandomBytesResponse{Data: data}

            **4. `raw_test.go`** (package gcp_kms_emulator_test)

            TestIntegration_RawEncryptDecrypt: RAW_ENCRYPT_DECRYPT key with AES_256_GCM.
            RawEncrypt, verify ct/IV/TagLength. RawDecrypt, verify roundtrip.

            TestIntegration_RawDecryptWrongAAD: Encrypt AAD "foo", decrypt AAD "bar" -> error.

            TestIntegration_GenerateRandomBytes: length=32 -> 32 bytes. length=0 -> error.

            ### Verification gate
            go build ./internal/storage/...

            ### Constraints
            - AES-256-GCM only (32-byte keys)
            - GenerateRandomBytes max 1024 bytes
          files:
            - internal/storage/raw.go
            - internal/storage/random.go
            - internal/server/raw.go
            - raw_test.go
          context_source: prepared-brief
        - id: D
          task: |
            ## Agent D -- Import Job Operations

            Implement CreateImportJob, GetImportJob, ListImportJobs, ImportCryptoKeyVersion.

            ### Files to create

            **1. `internal/storage/importjob.go`** (package storage)

            `CreateImportJob(keyringName, importJobID string, importMethod int32, protectionLevel int32) (*StoredImportJob, error)`
            - s.mu.Lock(), find keyring -> ErrNotFound
            - name := fmt.Sprintf("%s/importJobs/%s", keyringName, importJobID)
            - Check keyring.ImportJobs[name] -> ErrAlreadyExists
            - Generate RSA-2048 wrapping keypair, PEM-encode public key
            - Create StoredImportJob{State: 1 (ACTIVE), ExpireTime: now+72h, ...}

            `GetImportJob(name string) (*StoredImportJob, error)`
            - RLock, iterate keyrings checking ImportJobs -> ErrNotFound

            `ListImportJobs(keyringName string) ([]*StoredImportJob, error)`
            - RLock, find keyring -> ErrNotFound, return all ImportJobs

            `ImportCryptoKeyVersion(keyName string, algorithm int32, importJobName string, wrappedKey []byte) (*StoredCryptoKeyVersion, error)`
            - Lock, find cryptoKey + importJob, validate importJob State==1
            - Unwrap with RSA-OAEP, create new version with unwrapped SymmetricKey

            **2. `internal/server/importjob.go`** (package server)

            `CreateImportJob(ctx, req) (*kmspb.ImportJob, error)`
            - requireField(Parent), requireField(ImportJobId), validate ImportJob non-nil
            - checkPermission("CreateImportJob", NormalizeKeyRingResource)
            - Convert StoredImportJob to kmspb.ImportJob proto

            `GetImportJob`, `ListImportJobs` - similar pattern

            `ImportCryptoKeyVersion(ctx, req) (*kmspb.CryptoKeyVersion, error)`
            - requireField(Parent), requireField(ImportJob)
            - checkPermission("ImportCryptoKeyVersion", NormalizeCryptoKeyResource)
            - Extract wrappedKey from req (WrappedKey or RsaAesWrappedKey oneof)

            Import timestamppb for time conversion.

            **3. `importjob_test.go`** (package gcp_kms_emulator_test)

            TestIntegration_ImportJobLifecycle: Create + Get + List import job.

            TestIntegration_ImportCryptoKeyVersion: Create import job, encrypt AES key
            with import job public key, import it.

            ### Verification gate
            go build ./internal/storage/...

            ### Constraints
            - RSA-2048 OAEP SHA-256 for wrapping
            - ImportJob expires after 3 days
            - encoding/pem for PEM operations
          files:
            - internal/storage/importjob.go
            - internal/server/importjob.go
            - importjob_test.go
          context_source: prepared-brief
      base_commit: bd90397d6df5c906590be8034117ed1219f71ad1
    - number: 2
      agents:
        - id: E
          task: |
            ## Agent E -- Wire Everything: Shared File Modifications

            Modify storage.go, server.go, and permissions.go to connect Wave 1 work.

            ### 1. `internal/storage/storage.go`

            a) Add to StoredCryptoKeyVersion struct (after SymmetricKey line 81):
               AsymmetricKey *AsymmetricKeyMaterial
               HMACKey       []byte

            b) Add to StoredKeyRing struct (after CryptoKeys line 60):
               ImportJobs map[string]*StoredImportJob

            c) In CreateKeyRing (~line 104), add to StoredKeyRing literal:
               ImportJobs: make(map[string]*StoredImportJob),

            d) In CreateCryptoKey (~line 172), replace symmetric key generation with:
               symKey, asymKey, hmacKey, err := generateKeyMaterial(algorithm)
               Then set all three fields on StoredCryptoKeyVersion.

            e) Same in CreateCryptoKeyVersion (~line 394).

            f) Add RestoreCryptoKeyVersion:
               func (s *Storage) RestoreCryptoKeyVersion(versionName string) (*kmspb.CryptoKeyVersion, error)
               Find version, validate DESTROY_SCHEDULED, set DISABLED, return proto.

            ### 2. `internal/server/server.go`

            a) DELETE all 14 stub methods (lines ~414-468) returning Unimplemented.

            b) ADD RestoreCryptoKeyVersion server method:
               requireField, checkPermission("RestoreCryptoKeyVersion"), s.storage.RestoreCryptoKeyVersion

            c) ADD Decapsulate minimal stub:
