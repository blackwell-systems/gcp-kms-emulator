pre_mortem:
    overall_risk: medium
    rows:
        - scenario: |
            Duplicate method definitions in Wave 1: server method files conflict
            with stubs still in server.go.
          likelihood: high
          impact: medium
          mitigation: |
            Wave 1 verification gates test only storage layer compilation.
            Full module build requires Wave 2 stub removal. Integration tests
            run post-merge only.
        - scenario: |
            Wave 1 code references struct fields (AsymmetricKey, HMACKey,
            ImportJobs) not yet added to storage.go until Wave 2.
          likelihood: high
          impact: medium
          mitigation: |
            Wave 1 storage files will not compile against full module until
            Wave 2 completes. Verification gates use package-scoped build.
            AsymmetricKeyMaterial type is in scaffold keymaterial.go.
        - scenario: |
            generateKeyMaterial in scaffold does not cover all algorithm variants.
          likelihood: medium
          impact: high
          mitigation: |
            Scaffold includes comprehensive algorithm handling with default
            fallback. Post-merge test suite validates all paths.
        - scenario: |
            Missing IAM permission entries cause PermissionDenied.
          likelihood: low
          impact: low
          mitigation: |
            IAM disabled by default. Agent E adds all entries in Wave 2.
