title: Implement all 13 stubbed gRPC methods for full KMS RPC coverage
feature_slug: kms-full-rpc-coverage
verdict: SUITABLE
suitability_assessment: |
    SUITABLE -- All five suitability questions resolve cleanly.

    1. File decomposition: The 13 stub methods split naturally into 4 crypto
       domains (asymmetric, MAC, raw encrypt, import jobs) plus misc
       (GenerateRandomBytes, RestoreCryptoKeyVersion, Decapsulate). Each domain
       gets its own new server and storage files. No two agents modify the same
       file in the same wave.

    2. Investigation-first: None. All stubs are well-defined with clear proto types.

    3. Interface discoverability: Yes. Storage layer methods are the cross-agent
       boundary. Shared types (AsymmetricKeyMaterial, StoredImportJob) and the
       generateKeyMaterial function must be created in a scaffold file
       (internal/storage/keymaterial.go) before Wave 1 launches.

    4. Pre-implementation status: All 13 methods return Unimplemented. Existing
       17 methods and tests pass. Permission entries exist for GetPublicKey,
       AsymmetricSign, AsymmetricDecrypt, MacSign, MacVerify. Missing entries
       for 8 other operations are added in Wave 2.

    5. Parallelization value: HIGH. 4 parallel agents in Wave 1, each with
       3-4 files of real crypto logic. Clear speedup over sequential.

    Estimated times:
    - Scout: ~10 min
    - Agent execution: ~15 min (4 parallel + 1 sequential wave)
    - Merge: ~5 min
    Total: ~30 min. Sequential baseline: ~50 min. Savings: ~20 min (40%).

    SCAFFOLD REQUIRED: Before Wave 1, create internal/storage/keymaterial.go
    containing AsymmetricKeyMaterial struct, StoredImportJob struct, and
    generateKeyMaterial() function. Full contents specified in interface
    contracts below.
test_command: go test -v ./...
lint_command: go vet ./...
